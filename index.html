<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Xtra Qris</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Card Utama */
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 30px;
            box-shadow: 0px 10px 40px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            position: relative;
            padding: 40px 30px;
            border-top: 8px solid #e11922; /* Garis merah di bagian atas */
        }

        /* Bagian Logo */
        .logo-container {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .logo-container img {
            max-width: 180px;
            height: auto;
        }

        /* Judul dan Deskripsi */
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .login-header p {
            font-size: 13px;
            color: #666666;
            line-height: 1.6;
            padding: 0 10px;
        }

        /* Form Input */
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            color: #333;
        }

        .input-group input::placeholder {
            color: #a0aec0;
        }

        .input-group input:focus {
            border-color: #e11922;
            box-shadow: 0 0 0 3px rgba(225, 25, 34, 0.1);
        }

        /* Icon Mata untuk Password */
        .password-toggle {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #a0aec0;
        }

        /* Baris Opsi (Ingat Perangkat & Lupa Password) */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #4a5568;
            cursor: pointer;
        }

        .remember-me input {
            cursor: pointer;
            accent-color: #e11922;
        }

        .forgot-password {
            color: #e11922;
            text-decoration: none;
            font-weight: 600;
        }

        /* Tombol Masuk */
        .btn-submit {
            width: 100%;
            background: #e11922;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0px 8px 20px rgba(225, 25, 34, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background: #c3121a;
        }

        /* Bagian Daftar */
        .register-text {
            text-align: center;
            margin-top: 35px;
            font-size: 13px;
            color: #4a5568;
        }

        .register-link {
            color: #e11922;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        /* ========================================== */
        /* CSS UNTUK POP-UP MODAL (DI TENGAH LAYAR)   */
        /* ========================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Efek gelap di belakang */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 9999;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 320px;
            width: 90%;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h3 {
            color: #1a1a1a;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .modal-box p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal-btn {
            background: #e11922;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-btn:hover {
            background: #c3121a;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="https://res.cloudinary.com/flashphone/image/upload/v1781282321/QrisNew_ny9h69.png" alt="Xtra Qris Logo">
        </div>

        <div class="login-header">
            <h2>Masuk</h2>
            <p>Kelola transaksi QRIS dan pantau saldo merchant Anda secara real-time.</p>
        </div>

        <form onsubmit="openModal(); event.preventDefault();">
            <div class="input-group">
                <input type="text" placeholder="Email / Nomor WhatsApp" required>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
                <span class="password-toggle" onclick="togglePassword()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </span>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox"> Ingat Perangkat Ini
                </label>
                <a href="#" class="forgot-password">Lupa Password?</a>
            </div>

            <button type="submit" class="btn-submit">
                Masuk <span>&rarr;</span>
            </button>
        </form>

        <div class="register-text">
            Belum punya akun? <span class="register-link" onclick="openModal()">Daftar</span>
        </div>
    </div>

    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <h3>Pemberitahuan</h3>
            <p>FITUR INI AKAN HADIR</p>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        const modal = document.getElementById('customModal');

        // Fungsi membuka pop-up di tengah (digunakan bersama oleh tombol Masuk dan Daftar)
        function openModal() {
            modal.classList.add('active');
        }

        // Fungsi menutup pop-up
        function closeModal() {
            modal.classList.remove('active');
        }

        // Menutup pop-up jika pengguna klik di luar kotak putih
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }

        // Fungsi melihat/menyembunyikan password
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        }
    </script>

</body>
</html>
